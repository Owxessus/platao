name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[mcp,deep]' ruff pytest
      - name: Lint
        run: ruff check src tests
      - name: The proof gate — every check must pass its prove_effect + negative_control
        run: pytest -q
      - name: Dogfood — Platão must survive its own audit
        run: python -m platao.cli sweep src --fail-on high
