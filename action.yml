name: "Platão"
description: "Deterministic completeness auditor — fail the build on unfinished / placebo work."
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  paths:
    description: "Files or directories to audit."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the run (high | medium | low | never)."
    required: false
    default: "high"
  deep:
    description: "Install the optional tree-sitter deep layer (multi-language)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # Install the action's own checkout (the exact ref the workflow pinned), never a same-named
    # package from PyPI: `platao` is not published there, so a PyPI install failed — and would pull
    # whoever registers the name first.
    - name: Install Platão
      shell: bash
      run: pip install "${GITHUB_ACTION_PATH}${{ inputs.deep == 'true' && '[deep]' || '' }}"
    - name: Audit
      shell: bash
      run: platao sweep ${{ inputs.paths }} --fail-on ${{ inputs.fail-on }} --no-color
