[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platao"
version = "0.1.0"
description = "Deterministic completeness auditor for code and AI-generated work. It doesn't guess — it reads the AST."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["linter", "static-analysis", "ast", "code-review", "ai-agents", "anti-placebo", "mcp"]
authors = [{ name = "Owxessus" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []   # zero runtime dependencies — stdlib only, fully understood

[project.optional-dependencies]
# only the MCP server adapter needs this; the core stays zero-dep. <2: mcp 2.x removed
# `mcp.server.fastmcp` (renamed MCPServer), so the server did not even import on a fresh install.
mcp = ["mcp>=1.2,<2"]
deep = ["tree-sitter-language-pack>=0.7"]   # deep multi-language checks; core stays zero-dep without it

[project.urls]
Homepage = "https://github.com/Owxessus/platao"
Issues = "https://github.com/Owxessus/platao/issues"

[project.scripts]
platao = "platao.cli:main"
platao-mcp = "platao.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/platao"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
# The example agent ships deliberately-broken demo code (that's the point — it's what the auditor
# fires on). It must not be linted or it fails the very CI it demonstrates.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline fixture sources read best unwrapped
